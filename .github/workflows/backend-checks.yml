name: Backend checks

on:
  pull_request:
  push:
    branches:
      - add-shop-pos-backend

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check routes/auth.js
          node --check routes/products.js
          node --check routes/migration.js
          node --check test/smoke.test.js
      - name: Run isolated backend smoke test
        run: npm test
